    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do List</title>

        <style>
            body {
                font-family: Arial;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: #d78080;
                margin: 0;
            }


            
            .con {
                background: rgb(236, 214, 214);
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0  0 10px rgba(0,0,0,0.1);
                width: 300px;
                text-align: center;
            }

            input, select, button {
                width: 100%;
                margin-top: 10px;
                padding: 8px;
            }


            li {
                margin: 10px 0;
                cursor: pointer;
                text-align: left;
            }

            .selesai {
                text-decoration: line-through;
            color: gray;
            }

            button {
                margin-left: 5px
            }

        </style>
    </head>
    <body>

        <form class="container">
            <h1>To Do List</h1>

        <select id="kategori">
            <option>Penting dan Mendesak</option>
            <option>Penting tapi Tidak Mendesak</option>
            <option>Kurang Penting tapi Mendesak</option>
        </select>
    </form>

        <input type="text" id="inputTugas" placeholder="Masukkan tugas...">
        <button id="btnTambah">Tambah</button>
        <ul id="listTugas"></ul>
        
    <script src="todolist.js"></script>
        
    </body>
    </html>
